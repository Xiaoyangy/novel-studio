name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Go tests
        run: go test ./...
      - name: Vendored provider tests
        working-directory: third_party/litellm
        run: go test -race -count=1 ./...
      - name: Dashboard tests
        run: python -m unittest discover -s services/dashboard -p 'test_*.py'
      - name: Dashboard client tests
        run: node --test services/dashboard/test_client.js
      - name: Build release binary
        run: go build -trimpath -o /tmp/novel-studio ./cmd/novel-studio
      - name: Smoke test release binary
        run: |
          /tmp/novel-studio --version
          /tmp/novel-studio doctor --config /tmp/missing-novel-studio-config.json --json || test $? -eq 1

  race_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Race sharding contract tests
        run: bash scripts/test-agents-race-shard-test.sh
      - name: Race-sensitive packages
        run: go test -race -count=1 -timeout=10m ./internal/store ./internal/tools ./services/dashboard

  race_agents:
    runs-on: ubuntu-latest
    # The test timeout is cumulative per shard; leave setup/build/cleanup room.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Agents race shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: bash scripts/test-agents-race-shard.sh "$SHARD_INDEX"

  race:
    name: race
    needs: [race_core, race_agents]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every race job to succeed
        env:
          CORE_RESULT: ${{ needs.race_core.result }}
          AGENTS_RESULT: ${{ needs.race_agents.result }}
        run: |
          printf 'race_core=%s race_agents=%s\n' "$CORE_RESULT" "$AGENTS_RESULT"
          test "$CORE_RESULT" = success && test "$AGENTS_RESULT" = success

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: novel-studio:test
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test embedded dashboard
        run: |
          trap 'docker rm -f novel-studio-dashboard-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name novel-studio-dashboard-smoke \
            -p 18765:8765 novel-studio:test \
            service start --host 0.0.0.0 --port 8765
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18765/api/health | grep -q '"ok": true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs novel-studio-dashboard-smoke
          exit 1
